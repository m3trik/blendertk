[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blendertk"
dynamic = ["version", "readme"]
description = "A toolkit for Blender mirroring the mayatk public API, backing the tentacle Blender slots."
authors = [{name = "Ryan Simpson", email = "m3trik@outlook.com"}]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# bpy is provided by the Blender runtime, not pip-installed.
dependencies = [
    # 0.9.25 floor: the delta consumes pythontk APIs absent from 0.9.24, one of
    # them evaluated at import time (see mayatk's twin for the detail).
    "pythontk>=0.9.26",
    # 1.3.85 floor: marmoset_bridge_slots calls require_output_dir(mode) and sets
    # TRANSIENT_OUTPUT_MODES, neither of which exists in 1.3.84.
    "uitk>=1.3.87",
]

# unitytk is OPTIONAL: it only backs the Unity Bridge panel, for users who take
# exports into Unity and want to extend what ships here. Nothing in blendertk
# imports it at package-import time -- `env_utils/unity_bridge/` resolves
# lazily, so `import blendertk` and every non-Unity feature work without it.
# Install with the extra when you want the bridge:  pip install blendertk[unity]
[project.optional-dependencies]
unity = ["unitytk>=0.0.8"]

[project.urls]
Homepage = "https://github.com/m3trik/blendertk"
Repository = "https://github.com/m3trik/blendertk"

[tool.setuptools.dynamic]
version = {attr = "blendertk.__version__"}
readme = {file = "docs/README.md", content-type = "text/markdown"}

[tool.setuptools.packages.find]
where = ["."]
include = ["blendertk*"]

[tool.setuptools.package-data]
"*" = ["*.ui", "*.xml", "*.json", "*.txt", "*.md", "*.bat", "*.lua"]

[tool.pytest.ini_options]
# blendertk suites are standalone Blender scripts driven by test/run_tests.py.
# pytest must never collect them: importing a suite module executes it.
# norecursedirs, not --ignore: an --ignore path resolves against the CWD, so it
# silently stops guarding when pytest is invoked from outside this repo.
# Overriding norecursedirs drops its defaults - they are restated here.
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv", "node_modules", "test"]

[tool.ruff]
# House formatter/linter - rule set, exemptions and gate status: m3trik/docs/CODE_STANDARD.md section 1.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]  # house pattern: try-guarded DCC imports precede the other imports

[tool.ruff.lint.per-file-ignores]
"**/templates/**" = ["F821"]  # exec-templates carry __PLACEHOLDER__ tokens substituted at run time
